<style>
:root{
  --navy-deep:#0a1628; --navy-mid:#0f1d33;
  --gold:#c9a227; --gold-dim:#8a7a3a;
  --sea:#7fa89b; --parchment:#f4eee0;
  --text-primary:#e8e4dc; --text-secondary:#8a9ab0; --text-muted:#5a6a80;
  --bar-h:52px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%; overflow:hidden}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--navy-deep); color:var(--text-primary);
  display:flex; flex-direction:column}
.topbar{height:var(--bar-h); flex:0 0 var(--bar-h); display:flex; align-items:center;
  gap:.7rem; padding:0 1rem; background:var(--navy-mid);
  border-bottom:1px solid rgba(201,162,39,.28); position:relative; z-index:2}
.topbar img{width:32px; height:32px; border-radius:50%;
  box-shadow:0 0 12px rgba(201,162,39,.25)}
.brand{font-family:'Space Grotesk',sans-serif; font-weight:700; font-size:.92rem;
  letter-spacing:.1em; color:var(--parchment); text-decoration:none; white-space:nowrap}
.brand em{font-style:normal; color:var(--gold)}
.tag{font-size:.62rem; text-transform:uppercase; letter-spacing:.16em;
  color:var(--sea); border:1px solid rgba(127,168,155,.35); border-radius:100px;
  padding:.18rem .6rem; white-space:nowrap}
.spacer{flex:1}
.toplink{display:inline-flex; align-items:center; gap:.4rem; font-size:.78rem; font-weight:500;
  color:var(--text-secondary); text-decoration:none; padding:.35rem .8rem;
  border:1px solid rgba(255,255,255,.09); border-radius:6px; background:rgba(255,255,255,.03);
  white-space:nowrap; transition:all .2s ease}
.toplink:hover{color:var(--parchment); border-color:rgba(201,162,39,.35); background:rgba(201,162,39,.08)}
.toplink svg{width:14px; height:14px; fill:currentColor; opacity:.75}
.mapwrap{flex:1; position:relative; z-index:1}
.mapwrap iframe{position:absolute; inset:0; width:100%; height:100%; border:0; display:block}
@media (max-width:640px){
  :root{--bar-h:46px}
  .brand{font-size:.74rem; letter-spacing:.06em}
  .tag{display:none}
  .toplink{padding:.3rem .55rem; font-size:.72rem}
  .toplink .lbl{display:none}
}
</style>
</head>
